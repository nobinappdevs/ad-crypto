<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; }
  * { -webkit-font-smoothing: antialiased; }
  a { color: #0194fc; text-decoration: none; }
  a:hover { color: #67bffe; }
  input::placeholder { color: inherit; opacity: 0.55; }
  @keyframes authFloat { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-16px) rotate(2deg); } }
  @keyframes authFloatSlow { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  @keyframes authSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  @keyframes authSpinRev { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }
  @keyframes authPulse { 0%, 100% { opacity: 0.5; transform: scale(1); } 50% { opacity: 0.9; transform: scale(1.08); } }
  @keyframes authOrbit { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  @keyframes authCoinFlip { 0%, 100% { transform: rotateY(0deg); } 50% { transform: rotateY(180deg); } }
  @keyframes authSheen { 0% { transform: translateX(-120%); } 55%, 100% { transform: translateX(180%); } }
  @keyframes authSpark { 0%, 100% { opacity: 0.15; transform: scale(0.7); } 50% { opacity: 0.9; transform: scale(1.15); } }
  @keyframes authRise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
</style>
</helmet>
<div style="--accent: {{ c.accent }}; --pageBg: {{ c.pageBg }}; --panelBg: {{ c.panelBg }}; --promoBg: {{ c.promoBg }}; --fg: {{ c.fg }}; --muted: {{ c.muted }}; --fieldBg: {{ c.fieldBg }}; --border: {{ c.border }}; --statBg: {{ c.statBg }}; min-width: 1200px; min-height: 100vh; box-sizing: border-box; display: grid; place-items: center; padding: 44px; font-family: Outfit, system-ui, sans-serif; background: var(--pageBg); transition: background 0.5s ease;">

  <div style="position: relative; width: 1120px; border-radius: 30px; overflow: hidden; background: var(--panelBg); border: 1px solid var(--border); box-shadow: 0 46px 100px rgb(1 20 40 / 0.35); display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.06fr);">

    <button type="button" onClick="{{ toggleTheme }}" title="Toggle theme" style="position: absolute; right: 24px; top: 24px; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--border); background: var(--fieldBg); color: var(--fg); cursor: pointer; padding: 0; z-index: 4;" style-hover="border-color: var(--accent);">
      <span style="display: block; width: 16px; height: 16px;">{{ themeIcon }}</span>
    </button>

    <div style="position: relative; margin: 18px; border-radius: 22px; overflow: hidden; background: var(--promoBg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 46px 40px 40px; min-height: 660px;">

      <div style="position: relative; width: 340px; height: 330px;">
        <svg viewBox="0 0 340 330" style="position: absolute; inset: 0; width: 340px; height: 330px; overflow: visible;">
          <defs>
            <linearGradient id="giftFrontL" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#67bffe" stop-opacity="0.42" />
              <stop offset="1" stop-color="#0194fc" stop-opacity="0.2" />
            </linearGradient>
            <linearGradient id="giftFrontR" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#0194fc" stop-opacity="0.34" />
              <stop offset="1" stop-color="#015c97" stop-opacity="0.42" />
            </linearGradient>
            <linearGradient id="giftInner" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#013b63" stop-opacity="0.55" />
              <stop offset="1" stop-color="#0194fc" stop-opacity="0.28" />
            </linearGradient>
            <linearGradient id="lidTop" x1="0.1" y1="0" x2="0.9" y2="1">
              <stop offset="0" stop-color="#ffffff" />
              <stop offset="0.5" stop-color="#e9f0f6" />
              <stop offset="1" stop-color="#c3d0dc" />
            </linearGradient>
            <linearGradient id="lidEdge" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#c9d5e0" />
              <stop offset="1" stop-color="#93a4b4" />
            </linearGradient>
            <linearGradient id="bowGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#67bffe" />
              <stop offset="1" stop-color="#0194fc" />
            </linearGradient>
          </defs>

          <ellipse cx="172" cy="228" rx="126" ry="46" fill="none" stroke="var(--accent, #0194fc)" stroke-width="1.1" stroke-opacity="0.45" transform="rotate(-11 172 228)" />
          <circle cx="48" cy="238" r="4.4" fill="var(--accent, #0194fc)" />
          <path d="M126 128 C 166 92, 222 100, 244 136" fill="none" stroke="var(--accent, #0194fc)" stroke-width="1.1" stroke-opacity="0.35" />

          <g style="animation: authFloat 6.6s ease-in-out infinite; transform-origin: 170px 96px;">
            <path d="M170 104 C 132 104, 112 74, 132 58 C 152 43, 166 78, 170 104 Z" fill="url(#bowGrad)" fill-opacity="0.25" stroke="url(#bowGrad)" stroke-width="9" stroke-linejoin="round" />
            <path d="M170 104 C 208 104, 228 74, 208 58 C 188 43, 174 78, 170 104 Z" fill="url(#bowGrad)" fill-opacity="0.25" stroke="url(#bowGrad)" stroke-width="9" stroke-linejoin="round" />
            <ellipse cx="170" cy="104" rx="11" ry="8" fill="var(--accent, #0194fc)" />
          </g>

          <g style="animation: authFloat 6.6s ease-in-out infinite; transform-origin: 170px 130px;">
            <path d="M170 108 L 262 140 L 176 172 L 84 140 Z" fill="url(#lidTop)" stroke="#ffffff" stroke-opacity="0.7" stroke-width="1" />
            <path d="M84 140 L 176 172 L 176 184 L 84 152 Z" fill="url(#lidEdge)" />
            <path d="M176 172 L 262 140 L 262 152 L 176 184 Z" fill="#a8b7c5" />
            <path d="M120 132 L 200 158" stroke="#ffffff" stroke-opacity="0.85" stroke-width="1.4" />
          </g>

          <g style="animation: authFloatSlow 7.5s ease-in-out infinite; transform-origin: 170px 226px;">

            <path d="M94 202 L 170 228 L 170 292 L 94 266 Z" fill="url(#giftFrontL)" stroke="#8ed4ff" stroke-opacity="0.55" stroke-width="1.2" />
            <path d="M170 228 L 246 202 L 246 266 L 170 292 Z" fill="url(#giftFrontR)" stroke="#8ed4ff" stroke-opacity="0.45" stroke-width="1.2" />
            <path d="M170 228 L 170 292" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1.2" />
            <path d="M104 206 L 104 264" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1" />
            <path d="M236 206 L 236 264" stroke="#ffffff" stroke-opacity="0.28" stroke-width="1" />
          </g>

          <ellipse cx="170" cy="300" rx="86" ry="16" fill="var(--accent, #0194fc)" fill-opacity="0.16" />
        </svg>

        <div style="position: absolute; left: 70px; top: 78px; width: 200px; height: 200px; pointer-events: none; animation: authOrbit 26s linear infinite;">
          <div style="position: absolute; left: 50%; top: -13px; margin-left: -13px; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle at 34% 26%, #bfe6ff 0%, var(--accent, #0194fc) 60%, #0163a0 100%); box-shadow: 0 6px 14px rgb(1 148 252 / 0.4); color: #ffffff; font-size: 13px; font-weight: 700;">₿</div>
          <div style="position: absolute; left: 50%; bottom: -11px; margin-left: -11px; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle at 34% 26%, #e7f6ff 0%, #67bffe 62%, #0177cd 100%); box-shadow: 0 6px 14px rgb(1 148 252 / 0.32); color: #ffffff; font-size: 11px; font-weight: 700;">₿</div>
        </div>

        <div style="position: absolute; left: 62px; top: 62px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent, #0194fc); animation: authSpark 3.2s ease-in-out infinite;"></div>
        <div style="position: absolute; left: 292px; top: 118px; width: 6px; height: 6px; border-radius: 50%; background: #67bffe; animation: authSpark 2.6s ease-in-out 0.7s infinite;"></div>
        <div style="position: absolute; left: 34px; top: 168px; width: 5px; height: 5px; border-radius: 50%; background: #67bffe; animation: authSpark 3.6s ease-in-out 1.4s infinite;"></div>
        <div style="position: absolute; left: 306px; top: 268px; width: 7px; height: 7px; border-radius: 50%; background: var(--accent, #0194fc); animation: authSpark 3s ease-in-out 1.9s infinite;"></div>

        <div style="position: absolute; left: 132px; top: 148px; width: 78px; height: 78px; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle at 34% 26%, #9edaff 0%, var(--accent, #0194fc) 52%, #0163a0 100%); border: 4px solid rgb(255 255 255 / 0.78); box-shadow: inset 0 2px 0 rgb(255 255 255 / 0.55), 0 22px 40px rgb(1 148 252 / 0.4); color: #ffffff; z-index: 3; overflow: hidden; animation: authFloat 5.8s ease-in-out 0.3s infinite;">
          <span style="position: absolute; top: -20%; left: 0; width: 34%; height: 140%; background: linear-gradient(90deg, transparent, rgb(255 255 255 / 0.55), transparent); transform: skewX(-18deg); animation: authSheen 4.4s ease-in-out infinite;"></span>
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M8.6 6.6h4.6a2.7 2.7 0 010 5.4H8.6h5.2a2.7 2.7 0 010 5.4H8.6" /><path d="M8.6 6.6v10.8M10.9 4.2v2.4M13.6 4.2v2.4M10.9 17.4v2.4M13.6 17.4v2.4" /></svg>
        </div>

        <div style="position: absolute; left: 162px; top: 218px; width: 58px; height: 58px; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle at 34% 26%, #c6e9ff 0%, #38adfd 56%, #0177cd 100%); border: 3px solid rgb(255 255 255 / 0.7); box-shadow: 0 18px 32px rgb(1 148 252 / 0.34); color: #ffffff; z-index: 3; animation: authFloat 6.8s ease-in-out 0.9s infinite;">
          <svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 7h4.2a2.5 2.5 0 010 5H9h4.6a2.5 2.5 0 010 5H9" /><path d="M9 7v10M11.4 4.8V7M11.4 17v2.2" /></svg>
        </div>

        <div style="position: absolute; left: 226px; top: 12px; width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle at 34% 26%, #a6dfff 0%, var(--accent, #0194fc) 58%, #0163a0 100%); border: 2px solid rgb(255 255 255 / 0.6); box-shadow: 0 14px 26px rgb(1 148 252 / 0.34); color: #ffffff; animation: authFloat 5.2s ease-in-out 0.5s infinite;">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9.4 7.2h3.8a2.4 2.4 0 010 4.8H9.4h4.2a2.4 2.4 0 010 4.8H9.4" /><path d="M9.4 7.2v9.6M11.6 5.2v2M11.6 16.8v2" /></svg>
        </div>

        <div style="position: absolute; left: 8px; top: 250px; width: 62px; height: 62px; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle at 34% 26%, #e7f6ff 0%, #67bffe 52%, #0177cd 100%); border: 3px solid rgb(255 255 255 / 0.85); box-shadow: 0 18px 30px rgb(1 60 110 / 0.32); color: #014a80; transform: rotate(-18deg); animation: authFloat 6.2s ease-in-out 1.3s infinite;">
          <svg width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.4" stroke-opacity="0.45" /><path d="M9.6 7.8h3.6a2.3 2.3 0 010 4.6H9.6h4a2.3 2.3 0 010 4.6H9.6" /><path d="M9.6 7.8v9.2M11.7 6v1.8M11.7 17v1.8" /></svg>
        </div>

        <div style="position: absolute; left: 258px; top: 204px; width: 68px; height: 52px; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle at 38% 24%, #24384c 0%, #0b1c2b 58%, #061421 100%); border: 2px solid rgb(103 191 254 / 0.75); box-shadow: 0 18px 32px rgb(0 0 0 / 0.4); color: #8ed4ff; transform: rotate(24deg); animation: authFloat 7.2s ease-in-out 1.8s infinite;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 8.6c-.7-1.2-1.9-1.8-3.2-1.8-1.8 0-3.1 1-3.1 2.4 0 1.5 1.5 2 3.2 2.5s3.2 1 3.2 2.5c0 1.4-1.4 2.4-3.2 2.4-1.4 0-2.6-.6-3.2-1.8" /><path d="M12 4.4v15.2" /></svg>
        </div>
      </div>

      <h2 style="margin: 14px 0 0; width: 100%; text-align: center; font-size: 23px; line-height: 1.3; white-space: nowrap; font-weight: 700; letter-spacing: -0.025em; color: var(--fg);">Join AdCrypto <span style="color: var(--accent);">8800USDT</span> welcome gifts</h2>

      <div style="margin-top: 22px; width: 100%; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-radius: 16px; background: var(--statBg); border: 1px solid var(--border); overflow: hidden;">
        <div style="padding: 18px 14px; display: flex; flex-direction: column; gap: 5px; align-items: center; text-align: center;">
          <span style="font-size: 16px; font-weight: 700; color: var(--fg);">800 USDT</span>
          <span style="font-size: 11.5px; color: var(--muted);">Max Deposit Rewards</span>
        </div>
        <div style="padding: 18px 14px; display: flex; flex-direction: column; gap: 5px; align-items: center; text-align: center; border-left: 1px solid var(--border); border-right: 1px solid var(--border);">
          <span style="font-size: 16px; font-weight: 700; color: var(--fg);">3500 USDT</span>
          <span style="font-size: 11.5px; color: var(--muted);">Max Spot Rewards</span>
        </div>
        <div style="padding: 18px 14px; display: flex; flex-direction: column; gap: 5px; align-items: center; text-align: center;">
          <span style="font-size: 16px; font-weight: 700; color: var(--fg);">4500 USDT</span>
          <span style="font-size: 11.5px; color: var(--muted);">Max Futures Rewards</span>
        </div>
      </div>
    </div>

    <div style="padding: 58px 62px 48px; display: flex; flex-direction: column; justify-content: center;">
      <div key="{{ mode }}" style="display: flex; flex-direction: column; gap: 22px; animation: authRise 0.45s ease both;">

        <div style="display: flex; gap: 26px; align-items: center;">
          <button type="button" onClick="{{ showLogin }}" style="padding: 0 0 8px; border: none; background: transparent; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer; color: {{ loginTabFg }}; border-bottom: 2px solid {{ loginTabLine }}; transition: color 0.3s ease, border-color 0.3s ease;">Log In</button>
          <button type="button" onClick="{{ showRegister }}" style="padding: 0 0 8px; border: none; background: transparent; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer; color: {{ regTabFg }}; border-bottom: 2px solid {{ regTabLine }}; transition: color 0.3s ease, border-color 0.3s ease;">Register</button>
        </div>

        <div style="display: flex; flex-direction: column; gap: 10px;">
          <h1 style="margin: 0; font-size: 34px; line-height: 1.14; font-weight: 700; letter-spacing: -0.03em; color: var(--fg);">{{ title }}</h1>
          <p style="margin: 0; max-width: 440px; font-size: 14px; line-height: 1.7; color: var(--muted);">{{ blurb }}</p>
        </div>

        <sc-if value="{{ isRegister }}" hint-placeholder-val="{{ true }}">
          <div style="display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px;">
            <input type="text" placeholder="First Name" style="width: 100%; box-sizing: border-box; padding: 16px 18px; border-radius: 12px; border: 1px solid var(--border); background: var(--fieldBg); color: var(--fg); font-family: inherit; font-size: 14.5px; outline: none; transition: border-color 0.25s ease, box-shadow 0.25s ease;" style-focus="border-color: var(--accent); box-shadow: 0 0 0 4px rgb(1 148 252 / 0.14);" />
            <input type="text" placeholder="Last Name" style="width: 100%; box-sizing: border-box; padding: 16px 18px; border-radius: 12px; border: 1px solid var(--border); background: var(--fieldBg); color: var(--fg); font-family: inherit; font-size: 14.5px; outline: none; transition: border-color 0.25s ease, box-shadow 0.25s ease;" style-focus="border-color: var(--accent); box-shadow: 0 0 0 4px rgb(1 148 252 / 0.14);" />
          </div>
        </sc-if>

        <input type="email" placeholder="{{ emailPlaceholder }}" style="width: 100%; box-sizing: border-box; padding: 16px 18px; border-radius: 12px; border: 1px solid var(--border); background: var(--fieldBg); color: var(--fg); font-family: inherit; font-size: 14.5px; outline: none; transition: border-color 0.25s ease, box-shadow 0.25s ease;" style-focus="border-color: var(--accent); box-shadow: 0 0 0 4px rgb(1 148 252 / 0.14);" />

        <div style="position: relative; display: flex; align-items: center;">
          <input type="{{ pwType }}" placeholder="{{ pwPlaceholder }}" style="width: 100%; box-sizing: border-box; padding: 16px 52px 16px 18px; border-radius: 12px; border: 1px solid var(--border); background: var(--fieldBg); color: var(--fg); font-family: inherit; font-size: 14.5px; outline: none; transition: border-color 0.25s ease, box-shadow 0.25s ease;" style-focus="border-color: var(--accent); box-shadow: 0 0 0 4px rgb(1 148 252 / 0.14);" />
          <button type="button" onClick="{{ togglePw }}" title="Show password" style="position: absolute; right: 8px; width: 36px; height: 36px; border: none; border-radius: 9px; display: grid; place-items: center; background: transparent; color: var(--muted); cursor: pointer; transition: color 0.25s ease;" style-hover="color: var(--accent);">
            <span style="display: block; width: 18px; height: 18px;">{{ pwIcon }}</span>
          </button>
        </div>

        <sc-if value="{{ isRegister }}" hint-placeholder-val="{{ true }}">
          <label style="display: flex; align-items: center; gap: 11px; font-size: 13.5px; color: var(--muted); cursor: pointer;">
            <span onClick="{{ toggleTerms }}" style="width: 20px; height: 20px; flex: 0 0 20px; border-radius: 6px; display: grid; place-items: center; border: 1px solid {{ termsBorder }}; background: {{ termsBg }}; transition: background 0.25s ease, border-color 0.25s ease;">
              <span style="display: block; width: 12px; height: 12px; opacity: {{ termsCheckOpacity }};">{{ checkIcon }}</span>
            </span>
            <span>I have agreed with <a href="#">Terms Of Use &amp; Privacy Policy</a></span>
          </label>
        </sc-if>

        <sc-if value="{{ isLogin }}" hint-placeholder-val="{{ true }}">
          <div style="display: flex; justify-content: flex-end;">
            <a href="#" style="font-size: 13.5px; font-weight: 600;">Forgot Password?</a>
          </div>
        </sc-if>

        <button type="button" style="margin-top: 4px; padding: 17px; border: none; border-radius: 999px; background: var(--accent); color: #ffffff; font-family: inherit; font-size: 15.5px; font-weight: 700; cursor: pointer; box-shadow: 0 16px 34px rgb(1 148 252 / 0.34); transition: transform 0.25s ease, box-shadow 0.25s ease;" style-hover="transform: translateY(-2px); box-shadow: 0 22px 44px rgb(1 148 252 / 0.44);">{{ cta }}</button>

        <div style="display: flex; justify-content: center; gap: 6px; font-size: 13.5px; color: var(--muted);">
          <span>{{ switchPrompt }}</span>
          <button type="button" onClick="{{ toggleMode }}" style="border: none; background: transparent; padding: 0; font-family: inherit; font-size: 13.5px; font-weight: 700; color: var(--accent); cursor: pointer;">{{ switchAction }}</button>
        </div>

        <div style="display: flex; align-items: center; gap: 14px; margin-top: 2px;">
          <span style="flex: 1; height: 1px; background: var(--border);"></span>
          <span style="font-size: 12px; color: var(--muted);">Or continue with</span>
          <span style="flex: 1; height: 1px; background: var(--border);"></span>
        </div>

        <div style="display: flex; justify-content: center; gap: 14px;">
          <button type="button" title="Apple" style="width: 52px; height: 46px; border-radius: 13px; display: grid; place-items: center; border: 1px solid var(--border); background: var(--fieldBg); color: var(--fg); cursor: pointer; transition: transform 0.25s ease, border-color 0.25s ease;" style-hover="transform: translateY(-3px); border-color: var(--accent);">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M16.4 12.7c0-2.3 1.9-3.4 2-3.5-1.1-1.6-2.8-1.8-3.4-1.9-1.4-.1-2.7.8-3.4.8-.7 0-1.8-.8-3-.8-1.5 0-2.9.9-3.7 2.3-1.6 2.7-.4 6.7 1.1 8.9.8 1.1 1.6 2.2 2.8 2.2 1.1 0 1.5-.7 2.9-.7 1.3 0 1.7.7 2.8.7 1.2 0 2-1.1 2.8-2.2.6-.9.9-1.7 1-1.8-.1 0-2-.8-2-3zM14 5.4c.6-.7 1-1.7.9-2.7-.9 0-2 .6-2.6 1.3-.6.6-1 1.6-.9 2.6 1 .1 2-.5 2.6-1.2z" /></svg>
